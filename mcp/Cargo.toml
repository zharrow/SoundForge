[package]
name = "sound-forge-mcp"
version = "0.4.0"
edition = "2024"
description = "Serveur MCP qui expose sound-forge à Claude Code"

[dependencies]
sound-forge = { path = "..", features = ["schema"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
